name: Fetch GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Fetch GitHub Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import urllib.request
          import json
          import os

          # Target GitHub Username
          USERNAME = 'sun-9545sunoj'
          
          # Fetch User Profile Data
          req = urllib.request.Request(f'https://api.github.com/users/{USERNAME}')
          req.add_header('User-Agent', 'Mozilla/5.0')
          if os.environ.get('GITHUB_TOKEN'):
              req.add_header('Authorization', f'token {os.environ.get(\"GITHUB_TOKEN\")}')
          
          try:
              with urllib.request.urlopen(req) as response:
                  user_data = json.loads(response.read().decode())
                  
              stats = {
                  'followers': user_data.get('followers', 0),
                  'public_repos': user_data.get('public_repos', 0),
                  'profile_url': user_data.get('html_url', ''),
              }
              
              os.makedirs('frontend/assets', exist_ok=True)
              with open('frontend/assets/github-stats.json', 'w') as f:
                  json.dump(stats, f)
                  
          except Exception as e:
              print(f'Error fetching stats: {e}')
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/assets/github-stats.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update github stats" && git push)
